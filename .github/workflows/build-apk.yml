
name: Build BK Family Photo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'bk-family-logo.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android app
        run: |
          mkdir app
          cd app
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "BK Family Photo" "com.bkfamily.fc" --web-dir=www
          mkdir www
          cp ../index.html www/
          if [ -f ../bk-family-logo.png ]; then cp ../bk-family-logo.png www/; fi
          npx cap add android
          npx cap sync android


      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BK-Family-Photo-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
